<!doctype html>
<html lang="en" data-shell="browser">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <title>Clidable — CLI coding agents for everyone</title>
    <meta
      name="description"
      content="Clidable runs Claude Code, Codex, Antigravity and more as real terminals — with checkpoints you can rewind, a live preview, and one-click MCP, skills & plugins. Desktop, browser, or your phone."
    />
    <!-- Anti-clickjacking (OWASP frame-buster) — see web/index.html for why. -->
    <style>
      html {
        display: none;
      }
    </style>
    <script>
      if (self === top) {
        document.documentElement.style.display = "block";
      } else {
        top.location = self.location;
      }
    </script>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/landing-main.tsx"></script>
  </body>
</html>
