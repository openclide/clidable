<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Clidable</title>
    <!--
      Anti-clickjacking (OWASP frame-buster). Clidable spawns terminals, so a
      malicious page must not be able to iframe it and trick clicks. Bun's
      native HTML bundling can't attach X-Frame-Options/CSP to this document,
      so we hide the page by default and only reveal it once JS confirms we're
      the top window. If an attacker frames us with allow-scripts but sandboxes
      away top-navigation, the reveal never runs → the page stays blank →
      nothing to clickjack. (A reverse proxy should still send the real header;
      see docs/remote-vps.md.)
    -->
    <style>
      html {
        display: none;
      }
    </style>
    <script>
      if (self === top) {
        document.documentElement.style.display = "block";
      } else {
        top.location = self.location;
      }
    </script>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
