# CI — every push to main and every PR.
#
# Three independent jobs:
#   check   — Bun side: typecheck, tests, both production builds. The build
#             script self-verifies (Tailwind actually compiled, no source-tree
#             mutation, compiled binary boots + serves compiled CSS), so a green
#             `build:compile` here means a genuinely runnable artifact.
#   tauri   — Rust side on Linux. CLAUDE.md: a green macOS `cargo check` says
#             nothing about the Linux #[cfg] branch (gtk/webkit); this job is
#             where that branch actually gets type-checked.
#   windows — Bun AND Rust on a real Windows runner. Neither of the jobs above
#             can see a Windows bug: `which` vs `where.exe`, PowerShell hook
#             scripts, ConPTY, %APPDATA% paths, path separators. That gap let a
#             hard ENOENT ship — agent detection spawned `which`, which does not
#             exist on Windows, so EVERY terminal spawn failed there while both
#             ubuntu jobs stayed green. This job is the guard against a repeat.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build (bundle)
        run: bun run build

      - name: Production build (compiled binary, boot-verified)
        run: bun run build:compile

  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri 2 Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      # shared-key (instead of the default job-id key) so release.yml's
      # desktop legs can restore same-environment caches saved on main —
      # today that's windows↔windows only (the release linux leg runs 22.04,
      # not this runner's 24.04, and deliberately shares nothing). Keys
      # include the host triple, so the two jobs using this name never
      # collide with each other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # tauri-build resolves `externalBin` in its build script, so `cargo check`
      # dies before compiling a line when the triple-suffixed sidecar is absent
      # ("resource path `binaries/clidable-server-…` doesn't exist"). Unlike the
      # windows job below we do NOT build the real server here: this leg only
      # type-checks Rust, tauri-build never reads the sidecar's bytes, and a
      # 65 MB compile to satisfy an existence check is pure cost. `--stub` writes
      # the path (and the frontendDist dir) and nothing else.
      # rustc must already be on PATH — build-sidecar reads the host triple from it.
      - name: Stub the sidecar + frontendDist that tauri-build validates
        run: bun scripts/build-sidecar.ts --stub

      - name: cargo check (Linux branch)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # ConPTY landed in 1.3.14. Below that `Bun.Terminal` is POSIX-only and
          # every PTY in the app fails to open on Windows — keep this in step
          # with the `engines.bun` floor in package.json.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite is platform-aware: hook scripts assert PowerShell on Windows
      # and sh elsewhere, and resolveBin asserts the PATH lookup actually
      # resolves — which is what `which` vs `where.exe` broke.
      - name: Typecheck + tests (Windows)
        run: |
          bun run typecheck
          bun run test

      - uses: dtolnay/rust-toolchain@stable

      # shared-key (instead of the default job-id key) so release.yml's
      # desktop legs can restore same-environment caches saved on main —
      # today that's windows↔windows only (the release linux leg runs 22.04,
      # not this runner's 24.04, and deliberately shares nothing). Keys
      # include the host triple, so the two jobs using this name never
      # collide with each other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri

      # ONE compile, doing two jobs. Deliberately no --target: with one,
      # scripts/build.ts treats it as a cross-compile and downgrades its check to
      # "does the file exist", skipping the boot verification entirely. Without
      # one it compiles for the host — which on this runner IS windows-x64 — so
      # the binary is booted and asked for /api/health and compiled CSS, and then
      # staged under the triple name tauri-build needs.
      #
      # It has to run before cargo: tauri-build resolves `externalBin` at
      # build-script time and hard-fails if the sidecar is missing.
      # (rustc must be on PATH first — build-sidecar reads the host triple from it.)
      - name: Build + boot-verify the server, stage it as the sidecar
        run: bun scripts/build-sidecar.ts

      - name: cargo check (Windows branch)
        run: cargo check --manifest-path src-tauri/Cargo.toml
