# CI — every push to main and every PR.
#
# Two independent jobs:
#   check  — Bun side: typecheck, tests, both production builds. The build
#            script self-verifies (Tailwind actually compiled, no source-tree
#            mutation, compiled binary boots + serves compiled CSS), so a green
#            `build:compile` here means a genuinely runnable artifact.
#   tauri  — Rust side on Linux. CLAUDE.md: a green macOS `cargo check` says
#            nothing about the Linux #[cfg] branch (gtk/webkit); this job is
#            where that branch actually gets type-checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build (bundle)
        run: bun run build

      - name: Production build (compiled binary, boot-verified)
        run: bun run build:compile

  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (Linux branch)
        run: cargo check --manifest-path src-tauri/Cargo.toml
