# Release — push a `v*` tag, get a draft GitHub Release with compiled
# `clidable-server` binaries for every desktop platform.
#
# Bun cross-compiles standalone executables from a single host (the target
# runtime is downloaded and the app bundle embedded), so one Linux runner
# builds all five targets. Only the host-native binary can be boot-verified
# here; the others are existence-checked by scripts/build.ts, and their
# Tailwind/asset correctness is implied by the identical host build.
#
# The Release is created as a DRAFT — review the artifacts, then publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck + tests
        run: |
          bun run typecheck
          bun run test

      - name: Build host binary (linux-x64, boot-verified)
        run: |
          mkdir -p artifacts
          bun scripts/build.ts --compile
          mv dist/clidable-server artifacts/clidable-server-linux-x64

      - name: Cross-compile remaining targets
        run: |
          set -euo pipefail
          declare -A targets=(
            [bun-linux-arm64]=clidable-server-linux-arm64
            [bun-darwin-x64]=clidable-server-darwin-x64
            [bun-darwin-arm64]=clidable-server-darwin-arm64
            [bun-windows-x64]=clidable-server-windows-x64.exe
          )
          for target in "${!targets[@]}"; do
            bun scripts/build.ts --compile --target="$target"
            case "$target" in
              bun-windows-*) src=dist/clidable-server.exe ;;
              *)             src=dist/clidable-server ;;
            esac
            mv "$src" "artifacts/${targets[$target]}"
          done

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
