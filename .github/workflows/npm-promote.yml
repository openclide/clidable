# Promote the npm packages to `latest` when a GitHub Release is PUBLISHED.
#
# release.yml publishes all seven packages under the `staged` dist-tag, never
# `latest`. That's the whole point: the GitHub Release is created as a draft for
# a human to review, and an npm publish is irreversible — unpublish is blocked
# after 72 hours and the version can never be reused. Publishing to `latest`
# during the build would hand a not-yet-reviewed (possibly rejected) build to
# everyone running a bare `npm i -g clidable`.
#
# Moving a dist-tag, unlike publishing, IS reversible — so the risky half is the
# half that waits for the human.
#
# Pre-releases stop at `next`; only a normal version becomes `latest`.
name: npm promote

on:
  release:
    types: [published]
  # Recovery hatch: re-point the tags for a version that's already published
  # (e.g. this job failed, or a release was published before it existed).
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (no leading v), e.g. 0.1.1
        required: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Move the dist-tag to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ver="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          [ -n "$ver" ] || { echo "::error::no version to promote"; exit 1; }

          # A pre-release goes to `next`, not `latest`.
          case "$ver" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          echo "promoting $ver → $dist_tag"

          # The package list comes from the same table that staged them, so a new
          # target can't be forgotten here.
          mapfile -t pkgs < <(bun scripts/npm-package-names.ts)
          for pkg in "${pkgs[@]}"; do
            if ! npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "::error::$pkg@$ver is not published — did release.yml's npm job run?"
              exit 1
            fi
          done

          # Only after every package is confirmed present: a half-promoted set
          # would leave the wrapper pointing at binaries `latest` can't resolve.
          for pkg in "${pkgs[@]}"; do
            npm dist-tag add "$pkg@$ver" "$dist_tag"
          done

          echo "✓ $dist_tag now serves $ver"
